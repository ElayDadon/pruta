name: Feature request
description: An idea that would make Pruta better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
  - type: markdown
    attributes:
      value: Pruta stays fully local and offline — ideas that send data to a server or the cloud are out of scope.
