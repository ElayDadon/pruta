name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Engine & single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests (parsing, classification, insights)
        run: node tests/run.js
      - name: Build the single-file edition
        run: python tools/build-portable.py
      - name: Plan, editor and single-file checks
        run: node tests/studio.js

  motion:
    name: Motion, frame by frame
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Intro, import and every story on nine screen shapes
        run: python tests/motion.py
